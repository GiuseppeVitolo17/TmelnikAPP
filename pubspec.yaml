name: tmelnik_app
description: "A Flutter app for Tmelnik project management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  table_calendar: ^3.1.2
  http: ^1.1.0
  cached_network_image: ^3.3.1
  dart_rss: ^3.0.3
  intl: ^0.19.0
  crypto: ^3.0.3
  
  # Firebase - Latest compatible versions
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4  # For profile image uploads
  firebase_messaging: ^15.1.3  # Push notifications for Android/iOS
  google_sign_in: ^6.2.1
  
  # Image handling
  image_picker: ^1.1.2  # For selecting images from gallery/camera
  image: ^4.3.0  # For image resizing and compression
  image_cropper: ^5.0.1  # For cropping images to square
  
  # Notifications
  flutter_local_notifications: ^17.2.2  # Local notifications for Android/iOS
  
  # State management
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/placeholder.jpg

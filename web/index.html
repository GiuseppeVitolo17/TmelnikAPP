<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- Google Sign-In Configuration -->
  <!-- 
  IMPORTANTE: Sostituisci il Client ID con quello del tuo progetto Firebase
  
  Come ottenere il Client ID:
  1. Vai su Firebase Console → Project Settings → General
  2. Scorri fino a "Your apps" → Web app
  3. Copia il "Web client ID" (inizia con 950924265668-)
  4. Sostituisci il valore qui sotto
  
  Esempio:
  <meta name="google-signin-client_id" content="950924265668-YOUR_ACTUAL_CLIENT_ID.apps.googleusercontent.com">
  -->
  <meta name="google-signin-client_id" content="950924265668-m1ajd0cur7oi8uf90qqarfm1f5r3plj4.apps.googleusercontent.com">
  
  <!-- Google Sign-In Script -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tmelnik_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tmelnik Projects</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Loading screen styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 30%, #ffffff 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #loading-screen {
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
    }

    .title {
      font-size: 48px;
      font-weight: 900;
      color: #1565c0;
      letter-spacing: -1px;
      margin-bottom: 8px;
      animation: scaleIn 1s ease-out 0.3s both;
    }

    .subtitle {
      font-size: 32px;
      font-weight: 600;
      color: #1976d2;
      letter-spacing: 0.5px;
      margin-bottom: 60px;
      animation: scaleIn 1s ease-out 0.5s both;
    }

    .loading-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 40px;
      background: linear-gradient(45deg, #42a5f5, #1976d2, #0d47a1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotate 1.5s linear infinite, scaleIn 1s ease-out 0.7s both;
    }

    .loading-icon::before {
      content: "💼";
      font-size: 30px;
      color: white;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #1976d2;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { 
        opacity: 0; 
        transform: scale(0.8); 
      }
      to { 
        opacity: 1; 
        transform: scale(1); 
      }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 0.3; 
        transform: scale(1); 
      }
      50% { 
        opacity: 1; 
        transform: scale(1.2); 
      }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="title">Tmelnik</div>
    <div class="subtitle">Projects</div>
    <div class="loading-icon"></div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.style.animation = 'fadeOut 0.5s ease-out forwards';
      
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
      }, 500);
    });

    // Fallback: hide loading screen after 10 seconds
    setTimeout(() => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
        loadingScreen.classList.add('hidden');
      }
    }, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

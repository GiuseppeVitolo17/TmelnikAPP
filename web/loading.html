<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tmelnik Projects - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 30%, #ffffff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            color: #1565c0;
            letter-spacing: -1px;
            margin-bottom: 8px;
            animation: scaleIn 1s ease-out 0.3s both;
        }

        .subtitle {
            font-size: 32px;
            font-weight: 600;
            color: #1976d2;
            letter-spacing: 0.5px;
            margin-bottom: 60px;
            animation: scaleIn 1s ease-out 0.5s both;
        }

        .loading-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 40px;
            background: linear-gradient(45deg, #42a5f5, #1976d2, #0d47a1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 1.5s linear infinite, scaleIn 1s ease-out 0.7s both;
        }

        .loading-icon::before {
            content: "💼";
            font-size: 30px;
            color: white;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #1976d2;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { 
                opacity: 0; 
                transform: scale(0.8); 
            }
            to { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 0.3; 
                transform: scale(1); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1.2); 
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="title">Tmelnik</div>
        <div class="subtitle">Projects</div>
        <div class="loading-icon"></div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Hide loading screen when Flutter is ready
        window.addEventListener('flutter-first-frame', function () {
            const loadingContainer = document.querySelector('.loading-container');
            loadingContainer.style.animation = 'fadeOut 0.5s ease-out forwards';
            
            setTimeout(() => {
                loadingContainer.style.display = 'none';
            }, 500);
        });

        // Add fadeOut animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
